name: Apply theme ratio preview update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ratio-preview.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update theme editor ratio previews
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routes/_authenticated/themes.tsx')
          text = path.read_text()

          # Replace the existing Image shape select with three visual, clickable ratio cards.
          pattern = re.compile(r'<div><Label>Image shape</Label><select.*?</select></div></div></div>\}', re.DOTALL)
          replacement = '''<div><Label>Image shape</Label><div className="mt-2 grid grid-cols-3 gap-2"><button type="button" onClick={()=>patchSettings({productImageRatio:"square"})} className={"rounded-lg border p-2 text-left transition " + (current.productImageRatio === "square" || !current.productImageRatio ? "border-primary bg-primary/5 ring-1 ring-primary" : "hover:bg-muted")}><div className="aspect-square w-full rounded-md bg-muted"/><p className="mt-2 text-xs font-medium">Square</p><p className="text-[10px] text-muted-foreground">1:1</p></button><button type="button" onClick={()=>patchSettings({productImageRatio:"portrait"})} className={"rounded-lg border p-2 text-left transition " + (current.productImageRatio === "portrait" ? "border-primary bg-primary/5 ring-1 ring-primary" : "hover:bg-muted")}><div className="aspect-[4/5] w-full rounded-md bg-muted"/><p className="mt-2 text-xs font-medium">Portrait</p><p className="text-[10px] text-muted-foreground">4:5</p></button><button type="button" onClick={()=>patchSettings({productImageRatio:"landscape"})} className={"rounded-lg border p-2 text-left transition " + (current.productImageRatio === "landscape" ? "border-primary bg-primary/5 ring-1 ring-primary" : "hover:bg-muted")}><div className="aspect-[4/3] w-full rounded-md bg-muted"/><p className="mt-2 text-xs font-medium">Landscape</p><p className="text-[10px] text-muted-foreground">4:3</p></button></div><p className="mt-2 text-xs text-muted-foreground">Click a shape to see it immediately in the live preview below.</p></div></div></div>}'''
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Image shape target not found')
          text = text2

          # Add a visible badge to the live Products preview so the chosen ratio is obvious.
          old = '<h3 className="mb-3 font-semibold">Products</h3>'
          new = '<div className="mb-3 flex items-center justify-between gap-3"><h3 className="font-semibold">Products</h3><span className="rounded-full border px-2.5 py-1 text-[10px] font-medium uppercase tracking-wide text-muted-foreground">{current.productImageRatio === "portrait" ? "Portrait · 4:5" : current.productImageRatio === "landscape" ? "Landscape · 4:3" : "Square · 1:1"}</span></div>'
          if old not in text:
              raise SystemExit('Products preview heading target not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/themes.tsx .github/workflows/apply-ratio-preview.yml
          git commit -m "Improve theme editor product image ratio previews"
          git rm .github/workflows/apply-ratio-preview.yml
          git commit -m "Remove one-time theme ratio workflow"
          git push
