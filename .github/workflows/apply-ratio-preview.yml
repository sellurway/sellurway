name: Apply theme ratio preview update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ratio-preview.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update theme editor ratio previews
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/_authenticated/themes.tsx')
          text = path.read_text()

          old_sidebar = '''                {["hero", "featured", "categories", "products"].map((section) => ('''
          new_sidebar = '''                {allSections.map((section) => ('''
          if old_sidebar not in text:
              raise SystemExit('Sidebar target not found')
          text = text.replace(old_sidebar, new_sidebar, 1)

          old_products_editor = '''                {selectedSection === "products" && <div className="space-y-4"><div><Label>Products section photo</Label><input ref={productsFileRef} type="file" accept="image/*" className="hidden" onChange={(e)=>{const f=e.target.files?.[0]; if(f) uploadThemeImage(f,"productsImageUrl"); e.currentTarget.value="";}} /><div className="mt-2 flex gap-2"><Button type="button" variant="outline" onClick={()=>productsFileRef.current?.click()} disabled={uploading}><ImagePlus className="mr-2 h-4 w-4" />Add photo</Button>{current.productsImageUrl && <Button type="button" variant="ghost" onClick={()=>patchSettings({productsImageUrl:undefined})}>Remove</Button>}</div>{current.productsImageUrl && <img src={current.productsImageUrl} className="mt-3 h-28 w-full rounded-lg object-cover" alt="Products preview" />}</div><div className="grid gap-3 sm:grid-cols-2"><div><Label>Products per row</Label><select className="mt-1 flex h-10 w-full rounded-md border border-input bg-background px-3 text-sm" value={current.productColumns ?? 0} onChange={(e) => patchSettings({ productColumns: e.target.value === "0" ? undefined : Number(e.target.value) as 2 | 3 | 4 })}><option value={0}>Theme default</option><option value={2}>2 products</option><option value={3}>3 products</option><option value={4}>4 products</option></select></div><div><Label>Image shape</Label><select className="mt-1 flex h-10 w-full rounded-md border border-input bg-background px-3 text-sm" value={current.productImageRatio ?? "square"} onChange={(e) => patchSettings({ productImageRatio: e.target.value as "square" | "portrait" | "landscape" })}><option value="square">Square</option><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div></div></div>}'''

          new_products_editor = '''                {selectedSection === "products" && <div className="space-y-4"><div><Label>Products section photo</Label><input ref={productsFileRef} type="file" accept="image/*" className="hidden" onChange={(e)=>{const f=e.target.files?.[0]; if(f) uploadThemeImage(f,"productsImageUrl"); e.currentTarget.value="";}} /><div className="mt-2 flex gap-2"><Button type="button" variant="outline" onClick={()=>productsFileRef.current?.click()} disabled={uploading}><ImagePlus className="mr-2 h-4 w-4" />Add photo</Button>{current.productsImageUrl && <Button type="button" variant="ghost" onClick={()=>patchSettings({productsImageUrl:undefined})}>Remove</Button>}</div>{current.productsImageUrl && <img src={current.productsImageUrl} className="mt-3 h-28 w-full rounded-lg object-cover" alt="Products preview" />}</div><div className="grid gap-3 sm:grid-cols-2"><div><Label>Products per row</Label><select className="mt-1 flex h-10 w-full rounded-md border border-input bg-background px-3 text-sm" value={current.productColumns ?? 0} onChange={(e) => patchSettings({ productColumns: e.target.value === "0" ? undefined : Number(e.target.value) as 2 | 3 | 4 })}><option value={0}>Theme default</option><option value={2}>2 products</option><option value={3}>3 products</option><option value={4}>4 products</option></select></div><div><Label>Image shape</Label><div className="mt-2 grid grid-cols-3 gap-2"><button type="button" onClick={()=>patchSettings({productImageRatio:"square"})} className={"rounded-lg border p-2 text-left transition " + (current.productImageRatio === "square" || !current.productImageRatio ? "border-primary bg-primary/5 ring-1 ring-primary" : "hover:bg-muted")}><div className="aspect-square w-full rounded-md bg-muted"/><p className="mt-2 text-xs font-medium">Square</p><p className="text-[10px] text-muted-foreground">1:1</p></button><button type="button" onClick={()=>patchSettings({productImageRatio:"portrait"})} className={"rounded-lg border p-2 text-left transition " + (current.productImageRatio === "portrait" ? "border-primary bg-primary/5 ring-1 ring-primary" : "hover:bg-muted")}><div className="aspect-[4/5] w-full rounded-md bg-muted"/><p className="mt-2 text-xs font-medium">Portrait</p><p className="text-[10px] text-muted-foreground">4:5</p></button><button type="button" onClick={()=>patchSettings({productImageRatio:"landscape"})} className={"rounded-lg border p-2 text-left transition " + (current.productImageRatio === "landscape" ? "border-primary bg-primary/5 ring-1 ring-primary" : "hover:bg-muted")}><div className="aspect-[4/3] w-full rounded-md bg-muted"/><p className="mt-2 text-xs font-medium">Landscape</p><p className="text-[10px] text-muted-foreground">4:3</p></button></div><p className="mt-2 text-xs text-muted-foreground">Click a shape to see it immediately in the live preview below.</p></div></div></div>}'''
          if old_products_editor not in text:
              raise SystemExit('Products editor target not found')
          text = text.replace(old_products_editor, new_products_editor, 1)

          old_preview = '''                  <h3 className="mb-3 font-semibold">Products</h3>\n                  <div className={"grid gap-3 " + (current.productColumns === 2 ? "grid-cols-2" : current.productColumns === 3 ? "grid-cols-3" : "grid-cols-2 sm:grid-cols-4")}>\n                    {[1,2,3,4].map(n => <div key={n}><div className={(current.productImageRatio === "portrait" ? "aspect-[4/5]" : current.productImageRatio === "landscape" ? "aspect-[4/3]" : "aspect-square") + " rounded-md bg-muted"} /><div className="mt-2 h-3 w-4/5 rounded bg-muted" /></div>)}\n                  </div>'''
          new_preview = '''                  <div className="mb-3 flex items-center justify-between gap-3"><h3 className="font-semibold">Products</h3><span className="rounded-full border px-2.5 py-1 text-[10px] font-medium uppercase tracking-wide text-muted-foreground">{current.productImageRatio === "portrait" ? "Portrait · 4:5" : current.productImageRatio === "landscape" ? "Landscape · 4:3" : "Square · 1:1"}</span></div>\n                  <div className={"grid gap-3 " + (current.productColumns === 2 ? "grid-cols-2" : current.productColumns === 3 ? "grid-cols-3" : "grid-cols-2 sm:grid-cols-4")}>\n                    {[1,2,3,4].map(n => <div key={n}><div className={(current.productImageRatio === "portrait" ? "aspect-[4/5]" : current.productImageRatio === "landscape" ? "aspect-[4/3]" : "aspect-square") + " rounded-md bg-muted"} /><div className="mt-2 h-3 w-4/5 rounded bg-muted" /></div>)}\n                  </div>'''
          if old_preview not in text:
              raise SystemExit('Live preview target not found')
          text = text.replace(old_preview, new_preview, 1)

          path.write_text(text)
          PY

      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/themes.tsx .github/workflows/apply-ratio-preview.yml
          git commit -m "Improve theme editor product image ratio previews" || exit 0
          git rm .github/workflows/apply-ratio-preview.yml
          git commit -m "Remove one-time theme ratio workflow"
          git push
