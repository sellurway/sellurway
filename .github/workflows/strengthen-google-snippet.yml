name: Keep Google homepage metadata consistent

on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize homepage SEO metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/index.tsx')
          text = path.read_text()

          replacements = {
              'Sellurway — Free Online Store Builder | $10 Lifetime': 'Sellurway — Online Store Builder for Businesses',
              'Sellurway — Free Online Store Builder | 3 Products Free': 'Sellurway — Online Store Builder for Businesses',
              'Sellurway — Start Selling Online | Online Store Builder': 'Sellurway — Online Store Builder for Businesses',
              'Build your online store with Sellurway. Create a professional storefront, showcase products, take orders and grow your business from one simple platform.': 'Sellurway helps businesses build professional online stores, reach customers anywhere and manage their online business in one place.',
              'Start selling online free with Sellurway. Get 3 products, 2 free themes, checkout, WhatsApp and delivery orders. Upgrade once for $10 to unlock unlimited products and premium themes — no monthly subscription.': 'Sellurway helps businesses build professional online stores, reach customers anywhere and manage their online business in one place.',
              'Start selling without a monthly bill. Sellurway gives you 3 products and 2 free themes to launch your store, plus checkout, WhatsApp and delivery orders. When you need more, pay $10 once for unlimited products and premium themes — no monthly subscription.': 'Sellurway helps businesses build professional online stores, reach customers anywhere and manage their online business in one place.',
              'Start free with 3 products, 2 free themes, checkout, WhatsApp and delivery orders. Upgrade once for $10 to unlock unlimited products and premium themes — no monthly subscription.': 'Sellurway helps businesses build professional online stores, reach customers anywhere and manage their online business in one place.',
              'Start, run and grow your online business with Sellurway. Build a professional online store, showcase your products, reach customers anywhere and manage your business from one simple platform.': 'Sellurway helps businesses build professional online stores, reach customers anywhere and manage their online business in one place.',
              'Build a professional online store with Sellurway. Reach customers anywhere and manage your business from one simple platform.': 'Sellurway helps businesses build professional online stores, reach customers anywhere and manage their online business in one place.',
              'Build a professional online store with Sellurway. Reach customers anywhere and manage your business from one simple platform.': 'Sellurway helps businesses build professional online stores, reach customers anywhere and manage their online business in one place.',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          text = text.replace(
              'Sellurway — Start Selling Online',
              'Sellurway — Online Store Builder for Businesses'
          )

          path.write_text(text)
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize homepage search metadata'
          git push
