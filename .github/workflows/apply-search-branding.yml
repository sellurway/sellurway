name: Apply search branding copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routes/index.tsx')
          text = path.read_text()

          text, n1 = re.subn(r'\{ title: "[^"]*" \},', '{ title: "Sellurway — Start Selling Online | Online Store Builder" },', text, count=1)
          text, n2 = re.subn(r'\{\s*name: "description",\s*content:\s*".*?",\s*\},', '{\n        name: "description",\n        content:\n          "Launch your online store with Sellurway — a modern platform built for businesses ready to sell online. Create a professional storefront, reach customers anywhere and manage your business from one place.",\n      },', text, count=1, flags=re.DOTALL)
          text, n3 = re.subn(r'\{ property: "og:title", content: "[^"]*" \},', '{ property: "og:title", content: "Sellurway — Start Selling Online" },', text, count=1)
          text, n4 = re.subn(r'\{\s*property: "og:description",\s*content:\s*".*?",\s*\},', '{\n        property: "og:description",\n        content:\n          "Sellurway helps businesses build a professional online store, reach customers anywhere and grow online — without the complexity.",\n      },', text, count=1, flags=re.DOTALL)

          if not all((n1, n2, n3, n4)):
              raise SystemExit(f'Metadata update incomplete: title={n1}, description={n2}, ogtitle={n3}, ogdescription={n4}')
          path.write_text(text)
          PY
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx .github/workflows/apply-search-branding.yml
          git commit -m "Improve homepage search branding"
          git push
          git rm .github/workflows/apply-search-branding.yml
          git commit -m "Remove one-time search branding workflow"
          git push
