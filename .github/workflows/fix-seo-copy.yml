name: Update homepage SEO copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace homepage SEO copy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/index.tsx')
          text = path.read_text()
          text = text.replace('Sellurway — Free Online Store Builder | 3 Products Free', 'Sellurway — Start Selling Online')
          text = text.replace('Start selling online free with Sellurway. Get 3 products, 2 free themes, checkout, WhatsApp and delivery orders. Upgrade once for $10 to unlock unlimited products and premium themes — no monthly subscription.', 'Start selling online with Sellurway — a modern ecommerce platform built for ambitious businesses. Create a professional store, reach customers everywhere and manage your sales in one place. Built to help businesses launch, sell and grow.')
          text = text.replace('Start free with 3 products, 2 free themes, checkout, WhatsApp and delivery orders. Upgrade once for $10 to unlock unlimited products and premium themes — no monthly subscription.', 'Sellurway gives businesses a simple way to build a professional online store, take orders and grow online. Launch your store in minutes and sell your way.')
          path.write_text(text)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx .github/workflows/fix-seo-copy.yml
          git commit -m 'Strengthen homepage search messaging'
          git rm .github/workflows/fix-seo-copy.yml
          git commit -m 'Remove one-time SEO workflow'
          git push
